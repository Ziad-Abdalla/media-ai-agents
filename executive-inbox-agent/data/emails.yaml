- id: e46
  from: {name: "Karim Fadel", email: "karim.fadel@mbc-group.example"}
  to: ["ceo-office@sadaf.example"]
  cc: ["hind.subaie@sadaf.example"]
  date: "2026-10-12T10:20:00+03:00"
  subject: "Amendment No. 2 – Licence Agreement – Shadows of Sand (rights window)"
  message_id: "<CAMBC.20261012.102000.3340@mbc-group.example>"
  in_reply_to: null
  references: []
  body: |
    Dear Sadaf Legal,

    Please find attached draft Amendment No. 2 to the licence agreement for "Shadows of Sand".
    In short, it:
    - extends the exclusive first-run window on MBC and Shahid from 18 to 24 months;
    - adds a 6-month holdback on free-to-air broadcast by third parties in the GCC;
    - clarifies that promo clips under 3 minutes are not counted as a "broadcast".

    We need your comments or signature by Monday 19 October so the amendment is in place
    before the promo campaign starts on 1 November.

    Hind, I understand you are at MIPCOM this week. Happy to work with whoever is covering.

    Best regards,
    Karim Fadel
    Senior Legal Counsel
    MBC Group (demo)
    +971 4 555 0177
  html_hidden: null
  attachments:
    - filename: "SoS-Licence-Amendment-2-draft.pdf"
      text: |
        AMENDMENT No. 2 TO THE LICENCE AGREEMENT dated 12 March 2026 ("Shadows of Sand")
        between MBC Group (demo) and Sadaf Audio-Visual Production (demo).
        1. Clause 4.1 (Exclusivity Period) is amended to read "twenty-four (24) months from first broadcast".
        2. New Clause 4.5 (Holdback): Licensor shall not license free-to-air rights in the GCC for six (6) months after the Exclusivity Period.
        3. Clause 1 (Definitions): "Broadcast" excludes promotional clips of less than three (3) minutes.
        All other terms remain unchanged.
