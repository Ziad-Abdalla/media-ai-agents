# SYNTHETIC staff directory for a TV drama production house (all names invented).
# Used by the agent to resolve "who should own this task" and "who may approve what".
#
# people[].responsibilities: words (Arabic and English) that mean "this is my job".
#   The rules engine matches them against the task text and the email subject.
# people[].aliases: other ways the person is written in emails (first name, Arabic name).
# people[].out_of_office: dates the person is away; tasks go to their delegate.
# people[].can_approve: which agent actions this person may approve on the approval page.

company:
  name_en: Sadaf Audio-Visual Production (synthetic demo)
  name_ar: الصدف للإنتاج الصوتي والمرئي (بيانات تجريبية)
  domains: [sadaf.example]
  # Approved correspondents the office may reply to (always with a person's approval):
  # channels, the municipality, talent agencies under contract, registered vendors.
  # Anything else is "outside" and the agent can't send to it at all.
  partner_domains: [mbc-group.example, shahid.example, riyadh-municipality.example,
                    najmtalent.example, rawaj-talent.example, madar-artists.example,
                    desertlights-rental.example, falconcam-rental.example]
  executive_briefing_to: exec-office@sadaf.example
  # The inbox the agent reads (the CEO / GM office).
  office_inbox: ceo-office@sadaf.example
  agent_address: inbox-agent@sadaf.example

departments:
  executive_office:
    name_ar: المكتب التنفيذي
    categories: [approval_needed, meeting]
    keywords: [board, مجلس الإدارة, اجتماع, meeting, موعد, appointment, strategy, استراتيجية]
  production:
    name_ar: الإنتاج
    categories: []
    # Not "تصوير"/"shoot" alone: in a production company almost every email mentions filming.
    keywords: [shooting schedule, shoot day, call sheet, جدول التصوير, موعد التصوير, يوم التصوير, schedule, director, المخرج, set, لوكيشن, crew, الطاقم, overtime]
  locations:
    name_ar: المواقع والتصاريح
    categories: []
    keywords: [permit, تصريح, تصاريح, municipality, بلدية, أمانة, location, موقع التصوير, road closure, إغلاق, police, شرطة]
  post_production:
    name_ar: ما بعد الإنتاج
    categories: []
    keywords: [delivery, تسليم, master, ماستر, QC, مراجعة الجودة, subtitles, ترجمة, color, تلوين, edit, مونتاج, sound mix, ميكساج, deliverables]
  channel_relations:
    name_ar: العلاقات مع القنوات والمنصات
    categories: []
    keywords: [MBC, ام بي سي, Shahid, شاهد, channel, القناة, platform, المنصة, promo, برومو, trailer, إعلان تشويقي, airing, عرض, broadcast]
  legal:
    name_ar: الشؤون القانونية والعقود
    categories: [legal_contract]
    keywords: [contract, عقد, العقد, agent, وكيل, clause, بند, NDA, اتفاقية, rights, حقوق, signature, توقيع, dispute, نزاع]
  finance:
    name_ar: المالية
    categories: [vendor_finance]
    keywords: [invoice, فاتورة, payment, دفع, سداد, VAT, ضريبة, PO, أمر شراء, bank, تحويل, budget, ميزانية, rental fee, إيجار المعدات]
  hr:
    name_ar: الموارد البشرية
    categories: []
    keywords: [HR, الموارد البشرية, leave, إجازة, payroll, رواتب, hiring, توظيف, iqama, إقامة, visa, تأشيرة, onboarding, sick, مرضية]
  it_security:
    name_ar: تقنية المعلومات وأمن المعلومات
    categories: [suspicious]
    keywords: [password, كلمة المرور, phishing, تصيد, VPN, laptop, لابتوب, account, حساب, security, أمن]

