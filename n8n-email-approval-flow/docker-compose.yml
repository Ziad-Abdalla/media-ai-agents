# Local stack: n8n (the workflow), Postgres (booking data), Mailpit (fake mail server).
# Nothing here talks to a real mail server. The only outside call is to the Anthropic API.
services:
  n8n:
    image: n8nio/n8n:2.42.7
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Riyadh
      - TZ=Asia/Riyadh
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      - postgres
      - mailpit

  postgres:
    image: postgres:16
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=bookings_app
      - POSTGRES_USER=bookings
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localdev}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # web inbox + API
    environment:
      # Mailpit calls this n8n webhook every time a new email lands.
      - MP_WEBHOOK_URL=http://n8n:5678/webhook/new-mail
      # Default is 1 webhook per second; extra ones are silently dropped. 0 = no limit.
      - MP_WEBHOOK_LIMIT=0

volumes:
  n8n_data:
  pg_data:
