[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gulf-whisper-srt"
version = "0.3.1"
description = "Arabic (incl. Gulf dialect) audio/video to Arabic subtitles, a searchable dialogue index and a QC report, run locally with faster-whisper."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.1,<1.3",  # the version this was tested with
    "numpy",  # used directly by transcribe.py and the scripts
    "av<16",  # faster-whisper 1.2.1 passes an argument PyAV 16+ removed
]

[project.optional-dependencies]
# CUDA libraries for CTranslate2 on Windows/Linux when they are not installed system-wide.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]
dev = ["pytest"]

[tool.setuptools]
packages = ["gulf_srt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
